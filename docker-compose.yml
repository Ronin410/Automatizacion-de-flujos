# Compose de conveniencia para levantar el Dockerfile localmente con
# persistencia de datos entre reinicios y las variables de .env cargadas.
# Incluye PostgreSQL (necesario para probar los flujos de flows/premium/).
#
# Uso: docker compose up --build -d
services:
  n8n:
    build: .
    container_name: automatizacion-n8n
    depends_on:
      - postgres
    ports:
      - "5678:5678"
    env_file:
      # Copia .env.example a .env y completa lo que quieras probar
      # (puede quedar vacío para solo explorar la interfaz).
      - .env
    environment:
      - N8N_HOST=localhost
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - WEBHOOK_URL=http://localhost:5678/
      - GENERIC_TIMEZONE=UTC
      # Para el nivel Premium: si no defines DATABASE_URL propia en .env,
      # este valor apunta al Postgres local de este mismo compose.
      - DATABASE_URL=${DATABASE_URL:-postgres://n8n:n8n@postgres:5432/automatizacion}
    volumes:
      # Persiste workflows, credenciales y la DB interna de n8n entre reinicios.
      - n8n_data:/home/node/.n8n
      # Monta el repo de flujos también como volumen, por si se editan los
      # JSON en el host y se quieren re-importar sin reconstruir la imagen.
      - ./flows:/flows:ro
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: automatizacion-postgres
    environment:
      - POSTGRES_USER=n8n
      - POSTGRES_PASSWORD=n8n
      - POSTGRES_DB=automatizacion
    ports:
      # Expuesto por si quieres conectarte con psql/DBeaver desde el host.
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Aplica automáticamente db/schema.sql la primera vez que se crea el volumen.
      - ./db/schema.sql:/docker-entrypoint-initdb.d/schema.sql:ro
    restart: unless-stopped

volumes:
  n8n_data:
  postgres_data:
